name: fotografia-proyecto-21
services:
  clients-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fotografia_clientes
      POSTGRES_USER: fotografia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes: [clients-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fotografia -d fotografia_clientes']
      interval: 5s
      timeout: 3s
      retries: 20
  bookings-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fotografia_reservas
      POSTGRES_USER: fotografia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes: [bookings-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fotografia -d fotografia_reservas']
      interval: 5s
      timeout: 3s
      retries: 20
  clients:
    build: {context: ., dockerfile: Dockerfile}
    environment:
      FOTO_API_KEY: ${FOTO_API_KEY:?Define FOTO_API_KEY en .env}
      CLIENTS_DATABASE_URL: postgresql+psycopg://fotografia:${POSTGRES_PASSWORD}@clients-db/fotografia_clientes
    depends_on:
      clients-db: {condition: service_healthy}
    ports: ['127.0.0.1:8011:8000']
  bookings:
    build: {context: ., dockerfile: Dockerfile}
    command: [python, -m, uvicorn, 'app.bookings:create_app', --factory, --host, 0.0.0.0, --port, '8000']
    environment:
      FOTO_API_KEY: ${FOTO_API_KEY:?Define FOTO_API_KEY en .env}
      BOOKINGS_DATABASE_URL: postgresql+psycopg://fotografia:${POSTGRES_PASSWORD}@bookings-db/fotografia_reservas
      CLIENTS_URL: http://clients:8000
    depends_on:
      bookings-db: {condition: service_healthy}
    ports: ['127.0.0.1:8012:8000']
  web:
    build: {context: ../frontend}
    ports: ['127.0.0.1:8085:80']
    depends_on: [clients, bookings]
volumes:
  clients-data:
  bookings-data:
