name: fotografia-pruebas-p3

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fotografia_p3_test
      POSTGRES_USER: pruebas
      POSTGRES_PASSWORD: ${P3_PASSWORD:?Ejecuta preparar_entorno.py primero}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - datos_pruebas:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pruebas -d fotografia_p3_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  datos_pruebas:
